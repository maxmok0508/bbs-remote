name: Build BBS-Remote Windows x64 & macOS Intel

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (all, windows-x64, macos-intel)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows-x64
          - macos-intel

env:
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_RUST_VERSION: "1.75"
  BUILD_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate_bridge:
    name: Generate Flutter-Rust Bridge (3.24)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache generated Flutter-Rust bridge
        id: cache_bridge
        uses: actions/cache@v4
        with:
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
          key: frb-3.24-${{ hashFiles('src/flutter_ffi.rs') }}

      - name: Install prerequisites
        if: steps.cache_bridge.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates clang cmake curl gcc g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Rust toolchain
        if: steps.cache_bridge.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          components: "rustfmt"

      - name: Install Flutter
        if: steps.cache_bridge.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen
        if: steps.cache_bridge.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-expand --version 1.0.95
          cargo install --locked flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Generate bridge files
        if: steps.cache_bridge.outputs.cache-hit != 'true'
        run: |
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h \
            --extra-c-output-path ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact-flutter-3.24
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
          retention-days: 7

  build_windows_x64:
    name: Build Windows x64 Portable Package
    if: ${{ inputs.target == 'all' || inputs.target == 'windows-x64' }}
    needs: generate_bridge
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify encrypted server secrets
        shell: bash
        env:
          BBS_RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          BBS_RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          if [ -z "$BBS_RENDEZVOUS_SERVER" ] || [ -z "$BBS_RS_PUB_KEY" ]; then
            echo "ERROR: Missing RENDEZVOUS_SERVER or RS_PUB_KEY in GitHub Secrets!" >&2
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.BUILD_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: win-x64

      - name: Download bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-flutter-3.24
          path: ./

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet=x64-windows-static --host-triplet=x64-windows-static --x-install-root="$env:VCPKG_ROOT\installed"

      - name: Build BBS-Remote Windows x64
        shell: pwsh
        env:
          BBS_RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          BBS_RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          Write-Host "VCPKG_ROOT = $env:VCPKG_ROOT"
          if (-not (Test-Path "$env:VCPKG_ROOT\installed\x64-windows-static\include\libavcodec\avcodec.h")) {
            Write-Error "Missing FFmpeg headers under $env:VCPKG_ROOT\installed\x64-windows-static\include"
            exit 1
          }
          python build.py --flutter --hwcodec --skip-portable-pack
          $outDir = "BBS-Remote-${env:VERSION}-windows-x64"
          Copy-Item -Recurse -Force "flutter/build/windows/x64/runner/Release" $outDir
          if (Test-Path "$outDir/rustdesk.exe") {
            Rename-Item "$outDir/rustdesk.exe" "BBS-Remote.exe"
          }
          Compress-Archive -Path "$outDir/*" -DestinationPath "BBS-Remote-${env:VERSION}-windows-x64.zip" -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBS-Remote-windows-x64
          path: BBS-Remote-${{ env.VERSION }}-windows-x64.zip
          retention-days: 30

  build_macos_intel:
    name: Build macOS Intel x86_64 DMG
    if: ${{ inputs.target == 'all' || inputs.target == 'macos-intel' }}
    needs: generate_bridge
    runs-on: macos-15-intel
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install build runtime
        run: |
          brew install llvm create-dmg gnu-sed nasm
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.BUILD_RUST_VERSION }}
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-intel-x86_64

      - name: Download bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-flutter-3.24
          path: ./

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - name: Build BBS-Remote macOS Intel app
        shell: bash
        env:
          BBS_RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          BBS_RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          MIN_MACOS_VERSION="13.0"
          sed -i "s/MACOSX_DEPLOYMENT_TARGET=[0-9]*\.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i "s/osx_minimum_system_version = \"[0-9]*\.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/g" flutter/macos/Runner.xcodeproj/project.pbxproj
          export MACOSX_DEPLOYMENT_TARGET="${MIN_MACOS_VERSION}"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Ad-hoc codesign & package macOS Intel DMG
        shell: bash
        run: |
          APP_PATH="./flutter/build/macos/Build/Products/Release/BBS-Remote.app"
          /usr/bin/vtool -set-build-version macos 13.0 26.0 -replace \
            -output "$APP_PATH/Contents/MacOS/BBS-Remote" \
            "$APP_PATH/Contents/MacOS/BBS-Remote"
          bash ./.github/scripts/sign-macos-app.sh "$APP_PATH" "-" ./flutter/macos/Runner/Release.entitlements
          rm -rf dmg-staging
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/BBS-Remote.app
          ln -sf /Applications dmg-staging/Applications
          hdiutil create -volname "BBS-Remote" -srcfolder dmg-staging -ov -format UDZO "BBS-Remote-${VERSION}-macos-x86_64.dmg"
          codesign --force --sign "-" --identifier "com.bbs.remote.dmg" "BBS-Remote-${VERSION}-macos-x86_64.dmg"

      - name: Upload macOS Intel DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBS-Remote-macos-x86_64-dmg
          path: BBS-Remote-${{ env.VERSION }}-macos-x86_64.dmg
          retention-days: 30
