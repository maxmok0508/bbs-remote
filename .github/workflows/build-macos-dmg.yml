name: Build BBS-Remote macOS DMG

on:
  workflow_dispatch:

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  BRIDGE_FLUTTER_VERSION: "3.44.8"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate_bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge_codegen
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd

      - name: Generate bridge files
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact-flutter-3.44
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build_macos_arm64:
    name: Build macOS Apple Silicon DMG
    needs: [generate_bridge]
    runs-on: macos-26
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inject encrypted server configuration
        env:
          CUSTOM_RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          CUSTOM_RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          python3 - << 'PY'
          import os, pathlib, sys
          server = os.environ.get("CUSTOM_RENDEZVOUS_SERVER", "").strip()
          pub_key = os.environ.get("CUSTOM_RS_PUB_KEY", "").strip()
          if not server or not pub_key:
              print("ERROR: Missing RENDEZVOUS_SERVER or RS_PUB_KEY in GitHub Secrets!", file=sys.stderr)
              sys.exit(1)
          cfg_path = pathlib.Path("libs/hbb_common/src/config.rs")
          text = cfg_path.read_text(encoding="utf-8")
          old_srv = 'pub const RENDEZVOUS_SERVERS: &[&str] = &["rs-ny.rustdesk.com"];'
          old_key = 'pub const RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";'
          assert old_srv in text, "RENDEZVOUS_SERVERS placeholder not found in config.rs"
          assert old_key in text, "RS_PUB_KEY placeholder not found in config.rs"
          text = text.replace(old_srv, f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];', 1)
          text = text.replace(old_key, f'pub const RS_PUB_KEY: &str = "{pub_key}";', 1)
          cfg_path.write_text(text, encoding="utf-8")
          print("Successfully injected encrypted server and public key into config.rs.")
          PY

      - name: Install build runtime
        run: |
          brew install llvm create-dmg gnu-sed
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Install NASM 2.16.03
        run: |
          curl -fLO https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}
          cache: true

      - name: Configure Flutter for macOS arm64
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager
          FLUTTER_BIN_DIR="$(dirname "$(which flutter)")"
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          sed -i 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' "$FLUTTER_BIN_DIR/../packages/flutter/lib/src/scheduler/binding.dart"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-26-arm64

      - name: Download bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - name: Build BBS-Remote macOS app
        shell: bash
        run: |
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          MIN_MACOS_VERSION="12.3"
          sed -i "s/MACOSX_DEPLOYMENT_TARGET=[0-9]*\.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i "s/osx_minimum_system_version = \"[0-9]*\.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/g" flutter/macos/Runner.xcodeproj/project.pbxproj
          export MACOSX_DEPLOYMENT_TARGET="${MIN_MACOS_VERSION}"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Ad-hoc codesign BBS-Remote.app and package DMG
        shell: bash
        run: |
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          APP_PATH="./flutter/build/macos/Build/Products/Release/BBS-Remote.app"
          ls -la "$APP_PATH/Contents/MacOS/"
          bash ./.github/scripts/sign-macos-app.sh \
            "$APP_PATH" \
            "-" \
            ./flutter/macos/Runner/Release.entitlements
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG" || true
          create-dmg \
            --volname "BBS-Remote Installer" \
            --icon "BBS-Remote.app" 200 190 \
            --hide-extension "BBS-Remote.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "BBS-Remote-${VERSION}-macos-arm64.dmg" \
            "$APP_PATH"
          ls -lh "BBS-Remote-${VERSION}-macos-arm64.dmg"

      - name: Upload BBS-Remote DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBS-Remote-macos-arm64-dmg
          path: BBS-Remote-${{ env.VERSION }}-macos-arm64.dmg
          retention-days: 30
